<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login — Justin Creative</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 70% 20%,#16343b 0,transparent 40%),#080f12;color:#f5f9fa;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);border:1px solid #2d464e;border-radius:16px;background:#111d22;padding:32px;box-shadow:0 24px 90px #0007}.eyebrow{color:#7ddbea;letter-spacing:.16em;font-size:11px;font-weight:800;text-transform:uppercase}h1{font-size:32px;letter-spacing:-.04em;margin:14px 0 10px}p{color:#a9bec4;line-height:1.5;margin-bottom:24px}label{display:block;margin:18px 0;font-weight:650;font-size:13px}input{width:100%;display:block;margin-top:8px;padding:13px 14px;border:1px solid #45636d;border-radius:9px;background:#071317;color:white;font:inherit}input:focus{outline:2px solid #49c8de;outline-offset:2px}button{width:100%;padding:14px;background:#4ccfe4;color:#041417;border:0;border-radius:9px;font:800 15px system-ui;cursor:pointer}button:disabled{opacity:.55}a{color:#8de7f4}.error{color:#ffc2c2;min-height:1.4em;font-size:13px;margin:12px 0}</style></head><body><main class="card"><div class="eyebrow">Justin Creative / Backstage</div><h1>Admin sign in</h1><p>Sign in to manage event galleries, photos and website content.</p><form id="login"><label>Username<input id="username" autocomplete="username" maxlength="120" required autofocus></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="error" role="alert"></p><button id="submit">Sign in</button></form><p><a href="/">← Back to website</a></p></main><script>
(async()=>{try{let r=await fetch('/api/admin-login',{cache:'no-store'});if(r.ok&&(await r.json()).authenticated)location.replace('/admin/')}catch{}})();
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;err.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Sign-in failed');location.replace('/admin/')}catch(e){err.textContent=e.message;b.disabled=false}});
</script></body></html>
